name: Deploy to GitHub Pages

# Builds and publishes the game. Run it by hand from the Actions tab: the game is not public
# yet, so nothing is published on a push.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# To publish on every push to main later, add `push: { branches: [main] }` under `on`.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The waiting list. The key is Supabase's publishable key: it is meant to be public and lets a
      # visitor add a row and nothing else. Never put a secret or service-role key here.
      # While the Impressum or the privacy page still has a blank to fill in, the game is built
      # without the list, so it cannot open by accident.
      - name: Switch the waiting list on, if the legal pages are complete
        run: |
          if grep -q 'data-blank\|data-draft' impressum/index.html privacy/index.html; then
            echo "::warning::Impressum or privacy page is still a draft: building WITHOUT the waiting list."
          else
            echo "VITE_WAITLIST_URL=https://lecaoamodyjubwuvhpcq.supabase.co/rest/v1/waitlist" >> "$GITHUB_ENV"
            echo "VITE_WAITLIST_KEY=sb_publishable__R5VVIzkFXK-ozBm18IYjg_UTw7guWe" >> "$GITHUB_ENV"
          fi

      - name: Type-check and build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
